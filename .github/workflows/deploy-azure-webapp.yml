name: Build, Test and Deploy to Azure Web App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: omegafy-chat-api
  ACR_LOGIN_SERVER: omegafychatapi.azurecr.io
  ACR_NAME: omegafychatapi
  IMAGE_NAME: omegafy-chat-api
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore OmegaFY.Chat.API.sln

      - name: Build solution
        run: dotnet build OmegaFY.Chat.API.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test test/OmegaFY.Chat.API.Tests.Unit/OmegaFY.Chat.API.Tests.Unit.csproj -c Release --no-build --verbosity normal --logger trx --results-directory "TestResults/Unit"

      - name: Run integration tests
        env:
          ConnectionStrings__AzureSql: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          JwtSettings__Audience: ${{ secrets.JWT_AUDIENCE }}
          JwtSettings__Issuer: ${{ secrets.JWT_ISSUER }}
          JwtSettings__Secret: ${{ secrets.JWT_SECRET }}
          JwtSettings__TimeToExpireToken: ${{ secrets.JWT_TIME_TO_EXPIRE_TOKEN }}
          JwtSettings__TimeToExpireRefreshToken: ${{ secrets.JWT_TIME_TO_EXPIRE_REFRESH_TOKEN }}
          OpenTelemetrySettings__ServiceName: ${{ secrets.OPENTELEMETRY_SERVICE_NAME }}
          OpenTelemetrySettings__HoneycombSettings__HoneycombApiKey: ${{ secrets.HONEYCOMB_API_KEY }}
          OpenTelemetrySettings__HoneycombSettings__HoneycombUrl: ${{ secrets.HONEYCOMB_URL }}
        run: dotnet test test/OmegaFY.Chat.API.Tests.Integration/OmegaFY.Chat.API.Tests.Integration.csproj -c Release --no-build --verbosity normal --logger trx --results-directory "TestResults/Integration"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
                       -f src/OmegaFY.Chat.API.WebAPI/Dockerfile .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              { "name": "ConnectionStrings__AzureSql", "value": "${{ secrets.AZURE_SQL_CONNECTION_STRING }}", "slotSetting": false },
              { "name": "JwtSettings__Audience", "value": "${{ secrets.JWT_AUDIENCE }}", "slotSetting": false },
              { "name": "JwtSettings__Issuer", "value": "${{ secrets.JWT_ISSUER }}", "slotSetting": false },
              { "name": "JwtSettings__Secret", "value": "${{ secrets.JWT_SECRET }}", "slotSetting": false },
              { "name": "JwtSettings__TimeToExpireToken", "value": "${{ secrets.JWT_TIME_TO_EXPIRE_TOKEN }}", "slotSetting": false },
              { "name": "JwtSettings__TimeToExpireRefreshToken", "value": "${{ secrets.JWT_TIME_TO_EXPIRE_REFRESH_TOKEN }}", "slotSetting": false },
              { "name": "OpenTelemetrySettings__ServiceName", "value": "${{ secrets.OPENTELEMETRY_SERVICE_NAME }}", "slotSetting": false },
              { "name": "OpenTelemetrySettings__HoneycombSettings__HoneycombApiKey", "value": "${{ secrets.HONEYCOMB_API_KEY }}", "slotSetting": false },
              { "name": "OpenTelemetrySettings__HoneycombSettings__HoneycombUrl", "value": "${{ secrets.HONEYCOMB_URL }}", "slotSetting": false }
            ]